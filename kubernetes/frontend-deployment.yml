# frontend-deployment.yml - Nginx with the site. No env, no Secret, no readinessProbe
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: shoplist-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
