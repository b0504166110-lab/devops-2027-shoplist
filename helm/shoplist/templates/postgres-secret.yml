# postgres-secret.yml - postgres passwords
# Values come from values.yaml; b64enc encodes them to base64
apiVersion: v1
kind: Secret                  # which resource stores sensitive data?
metadata:
  name: postgres-secret     # postgres-deployment and backend-deployment look up this exact name
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
