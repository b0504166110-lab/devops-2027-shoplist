name: Website

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m py_compile site/*.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building docs"

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "Publishing"